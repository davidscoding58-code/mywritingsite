<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Essay Foundation — Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="login-page">

<div class="login-card">

    <h1>Essay Foundation</h1>

    <p>Enter your password to continue.</p>

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="Password"
            autofocus
            required
        >

        <button type="submit">
            Enter
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
